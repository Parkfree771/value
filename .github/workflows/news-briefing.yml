# 모닝 브리핑 — 해외 매체 RSS 헤드라인으로 순위 → Claude 가 이슈 10개를 직접 조사·작성 → 사이트(/briefing) 발행
#             + 가장 핫한 5개로 인스타 카드 5장 · 릴스 · 캡션 생성 (Neon Storage instagram/{날짜}/, 게시는 직접)
# 스크립트: scripts/news/run.mjs
#
# 목표 발행 시각은 06:00 KST. GitHub 예약 실행은 몇 시간씩 늦거나 빠지므로 예비 실행을 둔다.
# 예비 실행은 오늘(KST) 이미 발행됐으면 바로 끝난다.
#
# 필요한 Secrets: CLAUDE_CODE_OAUTH_TOKEN (claude setup-token — Claude 구독),
#   AWS_ENDPOINT_URL_S3 · AWS_ACCESS_KEY_ID · AWS_SECRET_ACCESS_KEY · AWS_REGION (Neon Object Storage),
#   REVALIDATE_SECRET, SITE_URL

name: news-briefing

on:
  schedule:
    - cron: '40 20 * * *'   # 05:40 KST (미국 장 마감 이후)
    - cron: '40 21 * * *'   # 06:40 KST 예비
    - cron: '0 23 * * *'    # 08:00 KST 예비
  workflow_dispatch:
    inputs:
      force:
        description: '오늘 이미 발행됐어도 다시 발행'
        type: boolean
        default: false
      skip_insta:
        description: '사이트 브리핑만 (인스타 파일 생략)'
        type: boolean
        default: false
      insta_only:
        description: '인스타만 다시 — 사이트 브리핑은 그대로 (디자인 수정 반영용)'
        type: boolean
        default: false
      theme:
        description: '카드·릴스 지면 — light 흰 지면 · dark 먹색 · both 흰 지면 게시 + 다크 비교본(Artifacts)'
        type: choice
        options: [light, dark, both]
        default: light
      dry_run:
        description: '시험 실행 — 업로드·사이트 갱신 없이 결과물만 (Artifacts 로 받기)'
        type: boolean
        default: false

concurrency:
  group: news-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      SITE_URL: ${{ secrets.SITE_URL || 'https://antstreet.kr' }}
      # 예약 실행은 저장소 변수 INSTA_THEME (없으면 light)
      INSTA_THEME: ${{ inputs.theme || vars.INSTA_THEME || 'light' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/news/package-lock.json
      - run: npm ci --prefix scripts/news --no-audit --no-fund
      - run: npm install -g @anthropic-ai/claude-code@2.1.301 --no-audit --no-fund
      - name: Run
        run: |
          node scripts/news/run.mjs \
            $([ "${{ inputs.force }}" = true ] && echo --force) \
            $([ "${{ inputs.skip_insta }}" = true ] && echo --skip-insta) \
            $([ "${{ inputs.insta_only }}" = true ] && echo --insta-only) \
            $([ "${{ inputs.dry_run }}" = true ] && echo --dry-run)
      # 카드·릴스·캡션을 Actions 화면에서도 바로 받을 수 있게
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briefing-${{ github.run_id }}
          path: scripts/news/out
          retention-days: 14
          if-no-files-found: ignore
