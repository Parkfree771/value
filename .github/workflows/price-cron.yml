# 가격 업데이트 + ISR keep-warm cron.
# 시간은 UTC (KST = UTC+9). GitHub 스케줄은 몇 분 늦게 시작될 수 있음.
#
# 필요한 Repository secrets:
#   DATABASE_URL, KIS_APP_KEY, KIS_APP_SECRET, REVALIDATE_SECRET
# 선택: KIS_BASE_URL (기본 실전 서버), SITE_URL (기본 https://antstreet.kr)

name: price-cron

on:
  schedule:
    - cron: '0 0 * * 1-5'    # ASIA 장중 09:00 KST
    - cron: '0 3 * * 1-5'    # ASIA 장중 12:00 KST
    # GitHub 예약 실행은 몇 시간씩 늦거나 빠질 수 있다 → 종가 확정은 예비 실행을 한 번 더 둔다.
    # 종가 날짜는 스크립트가 거래소 현지 "마지막 마감 거래일"로 계산하므로 두 번 돌아도 같은 행을 덮어쓸 뿐.
    - cron: '40 8 * * 1-5'   # ASIA 장 마감 17:40 KST (finalize — 홍콩 16:10 HKT 마감 이후)
    - cron: '40 10 * * 1-5'  # ASIA finalize 예비 19:40 KST
    - cron: '30 13 * * 1-5'  # US 장중 22:30 KST
    - cron: '0 16 * * 1-5'   # US 장중 01:00 KST
    - cron: '15 21 * * 1-5'  # US 장 마감 06:15 KST (finalize)
    - cron: '45 23 * * 1-5'  # US finalize 예비 08:45 KST
    - cron: '30 21 * * 1-5'  # 구루 포트폴리오 06:30 KST
    - cron: '*/20 * * * *'   # ISR keep-warm (홈/랭킹)
  workflow_dispatch:
    inputs:
      job:
        description: 'stock | guru | keepwarm'
        required: true
        default: stock
      market:
        description: 'stock 전용: ASIA | US | ALL'
        default: ALL
      finalize:
        description: 'stock 전용: 종가를 price_history에 기록'
        type: boolean
        default: false

concurrency:
  group: price-cron-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
  KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
  KIS_BASE_URL: ${{ secrets.KIS_BASE_URL }}
  REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
  SITE_URL: ${{ secrets.SITE_URL || 'https://antstreet.kr' }}

jobs:
  keepwarm:
    if: github.event.schedule == '*/20 * * * *' || inputs.job == 'keepwarm'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          curl -s -o /dev/null -w "/ %{http_code} %{time_total}s\n" --max-time 15 "$SITE_URL/" || true
          curl -s -o /dev/null -w "/ranking %{http_code} %{time_total}s\n" --max-time 15 "$SITE_URL/ranking" || true

  prices:
    if: github.event.schedule != '*/20 * * * *' && inputs.job != 'keepwarm'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/cron/package-lock.json
      # 스크립트 의존성은 scripts/cron/package.json 에만 (@neondatabase/serverless 하나).
      # 루트에서 npm install 하면 사이트 전체 의존성을 풀어 80초씩 걸렸음.
      - run: npm ci --prefix scripts/cron --no-audit --no-fund
      - name: Run
        env:
          SCHEDULE: ${{ github.event.schedule }}
          JOB: ${{ inputs.job }}
          MARKET: ${{ inputs.market }}
          FINALIZE: ${{ inputs.finalize }}
        run: |
          case "$SCHEDULE" in
            '0 0 * * 1-5'|'0 3 * * 1-5') node scripts/cron/update-stock-prices.mjs --market=ASIA ;;
            '40 8 * * 1-5'|'40 10 * * 1-5') node scripts/cron/update-stock-prices.mjs --market=ASIA --finalize ;;
            '30 13 * * 1-5'|'0 16 * * 1-5') node scripts/cron/update-stock-prices.mjs --market=US ;;
            '15 21 * * 1-5'|'45 23 * * 1-5') node scripts/cron/update-stock-prices.mjs --market=US --finalize ;;
            '30 21 * * 1-5')             node scripts/cron/update-guru-prices.mjs ;;
            '')
              if [ "$JOB" = guru ]; then
                node scripts/cron/update-guru-prices.mjs
              else
                node scripts/cron/update-stock-prices.mjs --market="$MARKET" $([ "$FINALIZE" = true ] && echo --finalize)
              fi ;;
          esac
