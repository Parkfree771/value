# 가격 업데이트 + ISR keep-warm cron.
# 시간은 UTC (KST = UTC+9). GitHub 스케줄은 몇 분 늦게 시작될 수 있음.
#
# 필요한 Repository secrets:
#   DATABASE_URL, KIS_APP_KEY, KIS_APP_SECRET, REVALIDATE_SECRET
# 선택: KIS_BASE_URL (기본 실전 서버), SITE_URL (기본 https://antstreet.kr)

name: price-cron

on:
  schedule:
    # 장 마감 종가만 — 종목마다 하루 한 번. 장중 갱신은 하지 않는다.
    # 예약 실행이 밀리거나 빠질 수 있어 마감 뒤 몇 번 걸어 둔다. 스크립트가 "이번 마감 이후 아직 갱신 안 된 종목"만
    # 20종목씩 끊어 묶음마다 저장하므로, 앞 실행이 다 끝냈으면 뒤 실행은 바로 끝난다.
    # 아시아(한국·일본 15:30, 중국 16:00, 홍콩 17:10 KST 마감) — 16:00~18:40 KST
    - cron: '0 7 * * 1-5'
    - cron: '40 7 * * 1-5'
    - cron: '20 8 * * 1-5'
    - cron: '0 9 * * 1-5'
    - cron: '40 9 * * 1-5'
    # 미국(정규장 16:00 ET = 05:00~06:00 KST 마감) — 06:15~08:30 KST
    - cron: '15 21 * * 1-5'
    - cron: '0 22 * * 1-5'
    - cron: '45 22 * * 1-5'
    - cron: '30 23 * * 1-5'
    - cron: '30 21 * * 1-5'  # 구루 포트폴리오 06:30 KST
    - cron: '*/20 * * * *'   # ISR keep-warm (홈/랭킹)
  workflow_dispatch:
    inputs:
      job:
        description: 'stock | guru | keepwarm'
        required: true
        default: stock
      market:
        description: 'stock 전용: ASIA | US | ALL'
        default: ALL
      finalize:
        description: 'stock 전용: 이미 오늘 종가가 반영된 종목도 다시 조회 (--force)'
        type: boolean
        default: false

concurrency:
  # 가격 갱신은 예약이 여러 개여도 한 줄로 세운다 — 밀린 실행끼리 겹쳐 같은 종목을 두 번 조회하지 않게
  group: price-cron-${{ github.event.schedule == '*/20 * * * *' && 'keepwarm' || github.event.schedule == '30 21 * * 1-5' && 'guru' || inputs.job || 'stock' }}
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
  KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
  KIS_BASE_URL: ${{ secrets.KIS_BASE_URL }}
  REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
  SITE_URL: ${{ secrets.SITE_URL || 'https://antstreet.kr' }}

jobs:
  keepwarm:
    if: github.event.schedule == '*/20 * * * *' || inputs.job == 'keepwarm'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          curl -s -o /dev/null -w "/ %{http_code} %{time_total}s\n" --max-time 15 "$SITE_URL/" || true
          curl -s -o /dev/null -w "/ranking %{http_code} %{time_total}s\n" --max-time 15 "$SITE_URL/ranking" || true

  prices:
    if: github.event.schedule != '*/20 * * * *' && inputs.job != 'keepwarm'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/cron/package-lock.json
      # 스크립트 의존성은 scripts/cron/package.json 에만 (@neondatabase/serverless 하나).
      # 루트에서 npm install 하면 사이트 전체 의존성을 풀어 80초씩 걸렸음.
      - run: npm ci --prefix scripts/cron --no-audit --no-fund
      - name: Run
        env:
          SCHEDULE: ${{ github.event.schedule }}
          JOB: ${{ inputs.job }}
          MARKET: ${{ inputs.market }}
          FINALIZE: ${{ inputs.finalize }}
        run: |
          case "$SCHEDULE" in
            '0 7 * * 1-5'|'40 7 * * 1-5'|'20 8 * * 1-5'|'0 9 * * 1-5'|'40 9 * * 1-5') node scripts/cron/update-stock-prices.mjs --market=ASIA ;;
            '15 21 * * 1-5'|'0 22 * * 1-5'|'45 22 * * 1-5'|'30 23 * * 1-5') node scripts/cron/update-stock-prices.mjs --market=US ;;
            '30 21 * * 1-5')             node scripts/cron/update-guru-prices.mjs ;;
            '')
              if [ "$JOB" = guru ]; then
                node scripts/cron/update-guru-prices.mjs
              else
                node scripts/cron/update-stock-prices.mjs --market="$MARKET" $([ "$FINALIZE" = true ] && echo --force)
              fi ;;
          esac
